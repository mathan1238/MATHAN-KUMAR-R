<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Mathan Mart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">Mathan<span>Mart</span></a>
    <div class="search-container">
      <input type="text" placeholder="Search products..." onkeydown="if(event.key==='Enter') window.location.href='products.html?search='+encodeURIComponent(this.value)">
    </div>
    <div class="header-actions" id="header-actions">
      <!-- Injected by auth.js -->
    </div>
  </header>

  <!-- Navigation -->
  <nav class="category-nav">
    <a href="index.html">Home</a>
    <a href="products.html">All Products</a>
    <a href="orders.html">My Orders</a>
  </nav>

  <!-- Main Content -->
  <main class="main-container" style="padding-top: 30px;">
    <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 24px;">Your Shopping Cart</h1>
    
    <div id="cart-content">
      <p style="text-align: center; padding: 40px; color: var(--text-muted);">Loading cart contents from server...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom">
      &copy; 2026 Mathan Mart. All rights reserved.
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      cart.loadCart();
    });
  </script>
</body>
</html>
