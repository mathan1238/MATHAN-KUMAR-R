<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Mathan Mart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">Mathan<span>Mart</span></a>
    <div class="header-actions">
      <a href="login.html" class="header-link">Sign In</a>
    </div>
  </header>

  <!-- Register Content -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join Mathan Mart as a buyer or seller</p>
      </div>

      <form class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" required placeholder="e.g. Ramesh Kumar">
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" required placeholder="ramesh@example.com">
        </div>

        <div class="form-group">
          <label for="reg-pass">Password</label>
          <input type="password" id="reg-pass" required placeholder="At least 6 characters">
        </div>

        <div class="form-group">
          <label for="reg-role">Account Type / Role</label>
          <select id="reg-role" required>
            <option value="buyer">Buyer (Shop, Order & Review)</option>
            <option value="seller">Seller (List & Manage Products)</option>
          </select>
        </div>

        <button type="submit" id="btn-reg" class="btn btn-primary btn-block" style="padding: 13px; margin-top: 10px;">
          Create My Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const pass = document.getElementById("reg-pass").value;
      const role = document.getElementById("reg-role").value;

      const btn = document.getElementById("btn-reg");
      btn.disabled = true;
      btn.textContent = "Creating Account...";

      const ok = await auth.register(name, email, pass, role);
      if (!ok) {
        btn.disabled = false;
        btn.textContent = "Create My Account";
      }
    }
  </script>
</body>
</html>
