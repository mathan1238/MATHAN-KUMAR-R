<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Mathan Mart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">Mathan<span>Mart</span></a>
    <div class="search-container">
      <input type="text" placeholder="Search products..." onkeydown="if(event.key==='Enter') window.location.href='products.html?search='+encodeURIComponent(this.value)">
    </div>
    <div class="header-actions" id="header-actions">
      <!-- Injected by auth.js -->
    </div>
  </header>

  <!-- Navigation -->
  <nav class="category-nav">
    <a href="index.html">Home</a>
    <a href="products.html">All Products</a>
    <a href="cart.html">Shopping Cart</a>
    <a href="orders.html" class="active">My Orders</a>
  </nav>

  <!-- Main Container -->
  <main class="main-container" style="padding-top: 30px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <div>
        <h1 style="font-size: 26px; font-weight: 800;">My Order History</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Track orders and leave product reviews</p>
      </div>
      <a href="products.html" class="btn btn-secondary btn-sm">Shop More Products</a>
    </div>

    <div id="orders-list">
      <p style="text-align: center; padding: 40px; color: var(--text-muted);">Loading your orders...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom">
      &copy; 2026 Mathan Mart. All rights reserved.
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      orders.loadOrders();
    });
  </script>
</body>
</html>
