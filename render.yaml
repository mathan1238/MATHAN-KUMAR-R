# Render Blueprint Specification for Mathan Mart
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mathan-mart
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mathan-mart-db
          property: connectionString

databases:
  - name: mathan-mart-db
    databaseName: mathan_mart
    user: mathan_mart_user
    plan: free
    region: oregon
